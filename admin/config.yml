backend:
  name: git-gateway
  branch: main
media_folder: "images"
public_folder: "/images"
collections:
    - name: "articulos"
    label: "Artículos"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
            - {label: "Título", name: "title", widget: "string"}
            - {label: "Fecha", name: "date", widget: "datetime"}
            - {label: "Contenido", name: "body", widget: "markdown"}
